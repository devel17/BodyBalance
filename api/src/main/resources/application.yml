## YAML Template.
---
server:
  port:
    8888
    
spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  devtools:
    livereload:
      enabled: true 
    restart:
      enabled: true
      additional-paths: /src/main/*         
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: bb
#    password: bb
#    url: jdbc:mysql://localhost:3306/bb
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PSQL_URL:jdbc:postgresql://localhost:5432/bb}
    username: ${PSQL_USERNAME:bb}
    password: ${PSQL_PASSWORD:bb}
  jpa:
    properties:
      hibernate:
          show_sql: false
          dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8103/realms/bb
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8103/realms/bb
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: api
            client-secret: aHtXRkUUYwemNNEgd8gyAPAVyxrslKFL
            scope: openid

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
    enable : true
  api-docs:
    path : /api

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web.filter.CorsFilter: DEBUG
    org.springframework: ERROR
    com.dev.validator: INFO
    org.hibernate.SQL: OFF
    org.springdoc: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
    file: "%d %p %c{1.} [%t] %m%n"
  file: app.log

application-description: Баланс тела
application-version: 1.0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: bb
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

keycloak:
  realm: bb
  username: admin
  password: admin
  url: http://localhost:8103
  #Keycloak admin panel -> RealmSettings -> Keys -> RSA(RS256) -> PublicKey
  publicKey: 
