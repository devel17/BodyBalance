plugins {
    id 'org.jetbrains.kotlin.jvm' version "1.9.21"
    id "org.jetbrains.kotlin.plugin.allopen" version "2.0.20"
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'com.dev.bb'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-test'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
        implementation 'org.postgresql:postgresql'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'org.jetbrains.kotlin:kotlin-reflect'
        implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
//        implementation 'com.mysql:mysql-connector-j:8.0.33'
//        implementation 'org.keycloak:keycloak-spring-boot-starter:25.0.3'
//        implementation 'org.keycloak:keycloak-admin-client:21.1.2'
        implementation 'org.keycloak:keycloak-admin-client:26.0.4'
        implementation("io.jsonwebtoken:jjwt-api:0.11.5")
        implementation("io.jsonwebtoken:jjwt-impl:0.11.5")
        implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")


//        implementation 'org.jetbrains.kotlin:kotlinx-coroutines-core'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'com.h2database:h2'
        testImplementation 'org.mockito:mockito-core:5.13.0'
    }
}



test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(17)
}

bootJar {
    enabled = true
}
springBoot {
    mainClass.set("com.dev.bb.BbApplicationKt")
}
sourceSets {
    main {
        kotlin {
            srcDirs = ['src/main/kotlin']
        }
    }
}